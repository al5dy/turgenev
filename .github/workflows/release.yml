name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # A tag push must clear the exact same quality gate as an ordinary CI run — PHP syntax,
  # version consistency, PHP tests, PHPCS/WPCS, JS syntax, JS tests, JS/CSS/package.json
  # lint, generated-asset consistency, build and package build — before a release is even
  # considered. This calls the same reusable workflow ci.yml calls, not a hand-copied
  # approximation of it, so the two cannot silently drift apart.
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml

  publish:
    name: Publish GitHub Release
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - uses: actions/download-artifact@v4
        with:
          name: turgenev-release
          path: dist
      - run: php tools/check-version.php
      # Re-verify the artifact actually downloaded for this job, not just the one the
      # quality-gate job happened to build: catches corruption in upload/download and
      # any gap between what was checked and what is about to be published.
      - name: Verify ZIP integrity
        run: unzip -t dist/*.zip
      - name: Verify every PHP-enqueued runtime asset is packaged
        run: node tools/verify-release-assets.mjs dist/*.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
