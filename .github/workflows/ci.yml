name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: php tools/check-php-syntax.php
      - run: php tools/check-version.php
      - run: php tests/php/run.php
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer lint

  javascript:
    name: JavaScript / CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run check:syntax
      - run: npm run test:js
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run lint:pkg-json

  package:
    name: Build release ZIP
    runs-on: ubuntu-latest
    needs: [ php, javascript ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - run: npm run build
      - run: bash tools/build-zip.sh
      - uses: actions/upload-artifact@v7
        with:
          name: turgenev-release
          path: dist/*.zip
          if-no-files-found: error
