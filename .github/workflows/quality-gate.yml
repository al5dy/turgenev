name: Quality gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          extensions: dom, mbstring, zip, xmlreader, xmlwriter, simplexml

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP syntax
        run: php tools/check-php-syntax.php

      - name: Check version consistency
        run: php tools/check-version.php

      - name: Run PHP regression tests
        run: php tests/php/run.php

      - name: Run PHP regression tests without DOM capability
        run: TURGENEV_FORCE_NO_DOM=1 php tests/php/run.php

      - name: Run PHPCS / WPCS
        run: composer lint

  javascript:
    name: JavaScript / CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run lint:js

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Run JavaScript regression tests
        run: npm run test:js

      - name: Lint CSS
        run: npm run lint:css

      - name: Validate package.json
        run: npm run lint:pkg-json

      - name: Build runtime assets
        run: npm run build

      - name: Verify committed runtime assets are current
        run: git diff --exit-code -- assets/build languages

  wordpress-e2e:
    name: WordPress E2E
    runs-on: ubuntu-latest
    needs:
      - php
      - javascript
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install browser-smoke Chromium
        run: npx playwright-cli install-browser chromium

      - name: Start disposable WordPress
        run: npx wp-env start

      - name: Resolve WordPress installation path
        id: wp-env-path
        shell: bash
        run: |
          WP_ROOT="$(npx wp-env install-path)/WordPress"

          if [[ ! -f "$WP_ROOT/wp-includes/assets/script-loader-packages.php" ]]; then
            echo "Invalid wp-env WordPress root: $WP_ROOT"
            find "$(npx wp-env install-path)" -maxdepth 3 -type f -name 'script-loader-packages.php' -print || true
            exit 1
          fi

          echo "root=$WP_ROOT" >> "$GITHUB_OUTPUT"
          echo "Resolved WordPress root: $WP_ROOT"

      - name: Wait for WordPress
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --max-time 5 \
              http://127.0.0.1:8888/wp-login.php >/dev/null; then
              echo "WordPress is ready."
              exit 0
            fi

            echo "Waiting for WordPress ($attempt/30)..."
            sleep 2
          done

          echo "WordPress did not become ready in time."
          npx wp-env logs --watch=false || true
          exit 1

      - name: Run browser smoke suite
        env:
          WP_TEST_ROOT: ${{ steps.wp-env-path.outputs.root }}
        run: npm run test:browser

      - name: Run real WordPress E2E suite
        env:
          WP_TEST_ROOT: ${{ steps.wp-env-path.outputs.root }}
          WP_ADMIN_USER: admin
          WP_ADMIN_PASSWORD: password
          WP_BASE_URL: http://127.0.0.1:8888
        run: npm run test:e2e

      - name: Capture wp-env logs on failure
        if: failure()
        run: npx wp-env logs --watch=false > wp-env.log 2>&1 || true

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: turgenev-e2e-diagnostics
          path: |
            playwright-report
            test-results
            output
            wp-env.log
            ${{ steps.wp-env-path.outputs.root }}/wp-content/debug.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop WordPress
        if: always()
        run: npx wp-env stop

  package:
    name: Build release ZIP
    runs-on: ubuntu-latest
    needs:
      - php
      - javascript
      - wordpress-e2e
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          extensions: zip

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build release ZIP
        run: bash tools/build-zip.sh

      - name: Verify generated assets remain synchronized
        run: git diff --exit-code -- assets/build languages

      - name: Resolve release ZIP
        id: package
        shell: bash
        run: |
          ZIP="$(find dist -maxdepth 1 -type f -name 'turgenev-*.zip' -print -quit)"

          if [[ -z "$ZIP" || ! -f "$ZIP" ]]; then
            echo "Release ZIP was not created."
            find dist -maxdepth 1 -type f -print || true
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Release ZIP: $ZIP"

      - name: Verify ZIP integrity
        run: unzip -t "${{ steps.package.outputs.zip }}"

      - name: Verify required runtime assets
        run: node tools/verify-release-assets.mjs "${{ steps.package.outputs.zip }}"

      - name: Verify release package contents
        shell: bash
        run: |
          ZIP="${{ steps.package.outputs.zip }}"
          unzip -Z1 "$ZIP" > /tmp/turgenev-release-files.txt
          cat /tmp/turgenev-release-files.txt

          REQUIRED_FILES=(
            "turgenev/turgenev.php"
            "turgenev/readme.txt"
            "turgenev/uninstall.php"
            "turgenev/LICENSE"
          )

          for REQUIRED in "${REQUIRED_FILES[@]}"; do
            grep -Fxq "$REQUIRED" /tmp/turgenev-release-files.txt || {
              echo "Missing required release file: $REQUIRED"
              exit 1
            }
          done

          if grep -Eq \
            '(^|/)(\.git|\.github|\.idea|\.vscode|\.playwright-cli|tests|docs|tools|node_modules|vendor|dist|output|test-results|playwright-report|coverage)(/|$)|(^|/)(composer\.(json|lock)|package(-lock)?\.json|README\.md|phpcs\.xml\.dist|playwright\.config\.(js|mjs|ts)|tsconfig\.json)$' \
            /tmp/turgenev-release-files.txt; then
            echo "Development-only files found in release ZIP."
            exit 1
          fi

      - name: Verify SHA-256 manifest
        shell: bash
        run: |
          SHA_FILE="${{ steps.package.outputs.zip }}.sha256"
          test -f "$SHA_FILE"
          (
            cd "$(dirname "$SHA_FILE")"
            sha256sum --check "$(basename "$SHA_FILE")"
          )

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: turgenev-release
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error
          retention-days: 14
