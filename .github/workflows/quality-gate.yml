name: Quality gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          extensions: dom, mbstring, zip, xmlreader, xmlwriter, simplexml

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP syntax
        run: php tools/check-php-syntax.php

      - name: Check version consistency
        run: php tools/check-version.php

      - name: Run PHP regression tests
        run: php tests/php/run.php

      - name: Run PHP regression tests without DOM capability
        run: TURGENEV_FORCE_NO_DOM=1 php tests/php/run.php

      - name: Run PHPCS / WPCS
        run: composer lint

  javascript:
    name: JavaScript / CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run lint:js

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Run JavaScript regression tests
        run: npm run test:js

      - name: Lint CSS
        run: npm run lint:css

      - name: Validate package.json
        run: npm run lint:pkg-json

      - name: Build runtime assets
        run: npm run build

      - name: Verify committed runtime assets are current
        run: git diff --exit-code -- assets/build languages

  wordpress-e2e:
    name: WordPress E2E
    runs-on: ubuntu-latest
    needs: [ php, javascript ]
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install browser-smoke Chromium
        run: npx playwright-cli install-browser chromium

      - name: Start disposable WordPress
        run: npx wp-env start

      - name: Resolve WordPress installation path
        id: wp-env-path
        shell: bash
        run: |
          set -euo pipefail

          STATUS="$(npx wp-env status)"
          printf '%s\n' "$STATUS"

          INSTALL_PATH="$(
            printf '%s\n' "$STATUS" \
              | sed -n 's/^[[:space:]]*-[[:space:]]*install path:[[:space:]]*//p' \
              | head -n 1
          )"

          if [[ -z "$INSTALL_PATH" || ! -d "$INSTALL_PATH" ]]; then
            echo "Unable to resolve wp-env install path from 'wp-env status'."
            exit 1
          fi

          PACKAGE_FILE="$(
            find "$INSTALL_PATH" \
              -type f \
              -path '*/wp-includes/assets/script-loader-packages.php' \
              -print \
              -quit
          )"

          if [[ -z "$PACKAGE_FILE" || ! -f "$PACKAGE_FILE" ]]; then
            echo "Unable to locate WordPress core under: $INSTALL_PATH"
            find "$INSTALL_PATH" -maxdepth 4 -type d -print | head -n 100 || true
            exit 1
          fi

          WP_ROOT="${PACKAGE_FILE%/wp-includes/assets/script-loader-packages.php}"

          if [[ ! -f "$WP_ROOT/wp-load.php" ]]; then
            echo "Resolved path is not a WordPress installation: $WP_ROOT"
            exit 1
          fi

          echo "root=$WP_ROOT" >> "$GITHUB_OUTPUT"
          echo "Resolved WordPress root: $WP_ROOT"

      - name: Wait for WordPress
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:8888/wp-login.php >/dev/null; then
              echo "WordPress is ready."
              exit 0
            fi
            echo "Waiting for WordPress ($attempt/45)..."
            sleep 2
          done
          echo "WordPress did not become ready in time."
          npx wp-env status || true
          npx wp-env logs --watch=false || true
          exit 1

      - name: Verify wp-env WP-CLI works
        run: npx wp-env run cli wp -- core version

      - name: Run browser smoke suite
        env:
          WP_TEST_ROOT: ${{ steps.wp-env-path.outputs.root }}
        run: npm run test:browser

      - name: Run real WordPress E2E suite
        env:
          WP_TEST_ROOT: ${{ steps.wp-env-path.outputs.root }}
          WP_ADMIN_USER: admin
          WP_ADMIN_PASSWORD: password
          WP_BASE_URL: http://127.0.0.1:8888
        run: npm run test:e2e

      - name: Capture E2E diagnostics
        if: failure()
        env:
          WP_TEST_ROOT: ${{ steps.wp-env-path.outputs.root }}
        shell: bash
        run: |
          npx wp-env status > wp-env-status.log 2>&1 || true
          npx wp-env logs --watch=false > wp-env.log 2>&1 || true
          if [[ -n "${WP_TEST_ROOT:-}" && -f "$WP_TEST_ROOT/wp-content/debug.log" ]]; then
            cp "$WP_TEST_ROOT/wp-content/debug.log" wp-debug.log
          fi

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: turgenev-e2e-diagnostics
          path: |
            playwright-report
            test-results
            output
            wp-env-status.log
            wp-env.log
            wp-debug.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop WordPress
        if: always()
        run: npx wp-env stop

  package:
    name: Build release ZIP
    runs-on: ubuntu-latest
    needs: [ php, javascript, wordpress-e2e ]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          extensions: zip

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build release ZIP
        run: bash tools/build-zip.sh

      - name: Verify generated assets remain synchronized
        run: git diff --exit-code -- assets/build languages

      - name: Resolve release ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find dist -maxdepth 1 -type f -name 'turgenev-*.zip' -print -quit)"
          if [[ -z "$ZIP" || ! -f "$ZIP" ]]; then
            echo "Release ZIP was not created."
            find dist -maxdepth 1 -type f -print || true
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Release ZIP: $ZIP"

      - name: Verify ZIP integrity
        run: unzip -t "${{ steps.package.outputs.zip }}"

      - name: Verify required runtime assets
        run: node tools/verify-release-assets.mjs "${{ steps.package.outputs.zip }}"

      - name: Verify SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          SHA_FILE="${{ steps.package.outputs.zip }}.sha256"
          test -f "$SHA_FILE"
          (
            cd "$(dirname "$SHA_FILE")"
            sha256sum --check "$(basename "$SHA_FILE")"
          )

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: turgenev-release
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error
          retention-days: 14
